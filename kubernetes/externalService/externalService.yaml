apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AFAskar/homelab.git
    targetRevision: main
    path: kubernetes/externalService/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
