apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpmb-reader
  labels:
    app.kubernetes.io/name: mpmb-reader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mpmb-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mpmb-reader
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: volume-permissions
          image: ghcr.io/afaskar/mpmpacrobatlinux:sha-ddc0f4f@sha256:304f78df8e357a472b9d5ab4e3a693c5e06e82a9353356648fb6dfa0f55c02e6
          command:
            - /bin/sh
            - -ec
            - |
              chown -R 1000:1000 /data/sheets
              chmod 0750 /data/sheets
              cp /etc/mpmb-git-secret/id_ed25519 /etc/mpmb-git/id_ed25519
              cp /etc/mpmb-git-secret/known_hosts /etc/mpmb-git/known_hosts
              chown 1000:1000 /etc/mpmb-git/id_ed25519 /etc/mpmb-git/known_hosts
              chmod 0400 /etc/mpmb-git/id_ed25519
              chmod 0444 /etc/mpmb-git/known_hosts
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: sheets
              mountPath: /data/sheets
            - name: git-ssh-secret
              mountPath: /etc/mpmb-git-secret
              readOnly: true
            - name: git-ssh-runtime
              mountPath: /etc/mpmb-git
      containers:
        - name: mpmb-reader
          image: ghcr.io/afaskar/mpmpacrobatlinux:sha-ddc0f4f@sha256:304f78df8e357a472b9d5ab4e3a693c5e06e82a9353356648fb6dfa0f55c02e6
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MPMB_SERVE_BIND
              value: "0.0.0.0:8080"
            - name: MPMB_DATA_DIR
              value: "/data/sheets"
            - name: MPMB_GIT_REPO
              value: "git@github.com:AFAskar/mpmb-characters.git"
            - name: MPMB_GIT_BRANCH
              value: "main"
            - name: MPMB_GIT_SSH_KEY
              value: "/etc/mpmb-git/id_ed25519"
            - name: MPMB_GIT_KNOWN_HOSTS
              value: "/etc/mpmb-git/known_hosts"
            - name: MPMB_GIT_AUTHOR_NAME
              value: "MPMB Reader"
            - name: MPMB_GIT_AUTHOR_EMAIL
              value: "mpmb-reader@home.internal"
            - name: MPMB_GIT_AUTO_SYNC_SECS
              value: "300"
            - name: MPMB_ALLOW_UNAUTHENTICATED
              value: "1"
          volumeMounts:
            - name: sheets
              mountPath: /data/sheets
            - name: tmp
              mountPath: /tmp
            - name: git-ssh-runtime
              mountPath: /etc/mpmb-git
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: sheets
          persistentVolumeClaim:
            claimName: mpmb-sheets
        - name: tmp
          emptyDir: {}
        - name: git-ssh-secret
          secret:
            secretName: mpmb-git-ssh
        - name: git-ssh-runtime
          emptyDir:
            medium: Memory
