apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpmb-reader
  labels:
    app.kubernetes.io/name: mpmb-reader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mpmb-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mpmb-reader
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: volume-permissions
          image: ghcr.io/afaskar/mpmpacrobatlinux:sha-ca484b7@sha256:13e9d9d2ed1c1c88b60ec38e3d2b2f9b463fa6e289d221dba4c7294f47b4fa6c
          command:
            - /bin/sh
            - -ec
            - chown -R 1000:1000 /data/sheets && chmod 0750 /data/sheets
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: sheets
              mountPath: /data/sheets
      containers:
        - name: mpmb-reader
          image: ghcr.io/afaskar/mpmpacrobatlinux:sha-ca484b7@sha256:13e9d9d2ed1c1c88b60ec38e3d2b2f9b463fa6e289d221dba4c7294f47b4fa6c
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MPMB_SERVE_BIND
              value: "0.0.0.0:8080"
            - name: MPMB_DATA_DIR
              value: "/data/sheets"
            - name: MPMB_GIT_AUTO_SYNC_SECS
              value: "300"
            - name: MPMB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mpmb-config
                  key: MPMB_AUTH_TOKEN
                  optional: false
          envFrom:
            - secretRef:
                name: mpmb-config
          volumeMounts:
            - name: sheets
              mountPath: /data/sheets
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: sheets
          persistentVolumeClaim:
            claimName: mpmb-sheets
        - name: tmp
          emptyDir: {}
