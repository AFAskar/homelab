- name: Resolve stable OCI device
  ansible.builtin.command:
    argv: [readlink, -e, "{{ wings_data_device }}"]
  register: data_device
  changed_when: false
- name: Reject boot disks, partitions, and unexpected volume size
  ansible.builtin.command:
    argv: [lsblk, -bdno, "SIZE,TYPE,MOUNTPOINTS", "{{ data_device.stdout }}"]
  register: disk_identity
  changed_when: false
- name: Require the exact unused 200 GB OCI data disk before initialization
  ansible.builtin.assert:
    that:
      - disk_identity.stdout.split()[0] | int >= 200000000000
      - disk_identity.stdout.split()[0] | int <= 214748364800
      - disk_identity.stdout.split()[1] == 'disk'
  when: wings_initialize_empty_volume
- name: Read existing filesystem signature without modifying disk
  ansible.builtin.command:
    argv: [blkid, -p, -s, TYPE, -o, value, "{{ data_device.stdout }}"]
  register: data_signature
  failed_when: data_signature.rc not in [0, 2]
  changed_when: false
- name: Require explicit initialization of identified blank new disk
  ansible.builtin.assert:
    that:
      - data_device.stdout | length > 0
      - data_signature.rc == 0 or wings_initialize_empty_volume
    fail_msg: Blank disk requires explicit authorization and verified volume/device identity. Existing disks are never reformatted.
- name: Check all disk signatures before initialization
  ansible.builtin.command:
    argv: [wipefs, --no-act, --noheadings, --output, TYPE, "{{ data_device.stdout }}"]
  register: data_all_signatures
  changed_when: false
  when: wings_initialize_empty_volume and data_signature.rc == 2
- name: Check partition table before initialization
  ansible.builtin.command:
    argv: [lsblk, --nodeps, --noheadings, --output, PTTYPE, "{{ data_device.stdout }}"]
  register: data_partition_table
  changed_when: false
  when: wings_initialize_empty_volume and data_signature.rc == 2
- name: Refuse to initialize any disk with existing metadata
  ansible.builtin.assert:
    that:
      - data_all_signatures.stdout | trim | length == 0
      - data_partition_table.stdout | trim | length == 0
    fail_msg: Disk contains a filesystem or partition table; initialization is forbidden.
  when: wings_initialize_empty_volume and data_signature.rc == 2
- name: Initialize only blank authorized data disk
  community.general.filesystem:
    dev: "{{ data_device.stdout }}"
    fstype: ext4
    force: false
  when: data_signature.rc == 2 and wings_initialize_empty_volume
- name: Read filesystem UUID
  ansible.builtin.command:
    argv: [blkid, -s, UUID, -o, value, "{{ data_device.stdout }}"]
  register: data_uuid
  changed_when: false
- name: Require a stable UUID
  ansible.builtin.assert:
    that: data_uuid.stdout | length > 0
- name: Mount persistent data by UUID
  ansible.posix.mount:
    path: "{{ wings_data_mount }}"
    src: "UUID={{ data_uuid.stdout }}"
    fstype: "{{ data_signature.stdout if data_signature.rc == 0 else 'ext4' }}"
    opts: defaults
    state: mounted
# No Docker data-root migration on an existing node. Panel-generated config MUST
# put paid game data in /srv/pelican/volumes. Service requires that mount.
