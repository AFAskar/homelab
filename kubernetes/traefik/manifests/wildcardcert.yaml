apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-arpa-wildcard
  namespace: kube-system
spec:
  secretName: home-arpa-wildcard-tls
  duration: 2160h
  renewBefore: 360h
  commonName: "*.home.arpa"
  subject:
    organizations:
      - Homelab
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
  usages:
    - digital signature
    - server auth
  dnsNames:
    - "*.home.arpa"
    - "home.arpa"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
