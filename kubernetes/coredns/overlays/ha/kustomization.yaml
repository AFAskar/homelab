apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../manifests
  - autoscaling.yaml
patches:
  - target:
      kind: ConfigMap
      name: coredns-custom
    patch: |-
      - op: replace
        path: /data/internal.server
        value: |
          home.internal:53 {
            errors
            cache 30
            forward . 192.168.1.28:5353 192.168.1.23:5353 {
              policy random
              health_check 2s
              max_fails 1
            }
          }
