apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pelican
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AFAskar/homelab.git
    targetRevision: main
    path: kubernetes/pelican/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: pelican
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
