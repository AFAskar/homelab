apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mpmb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AFAskar/homelab.git
    targetRevision: main
    path: kubernetes/mpmb/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: mpmb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
