apiVersion: v1
kind: Service
metadata:
  name: adguard-ui
spec:
  type: ExternalName
  externalName: pos.home.internal
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-ui

spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dns.home.internal
  rules:
    - host: dns.home.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adguard-ui
                port:
                  name: http
