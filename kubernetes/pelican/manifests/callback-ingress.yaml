# Dedicated listener: no UI, client API, application API or other homelab hosts.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican-callback
spec:
  entryPoints:
  - pelican-callback
  routes:
  - kind: Rule
    match: Host(`pelican.home.internal`) && PathPrefix(`/api/remote/`)
    services:
    - name: pelican
      port: 80
  tls:
    secretName: pelican-tls
