#cloud-config
# Initial setup only. Ansible handles Docker, Wings, storage and firewall after
# volume attachment; no secrets or formatting in user-data.
package_update: true
packages:
  - ca-certificates
  - curl
  - python3
  - python3-apt
  - iptables
  - e2fsprogs
ssh_pwauth: false
disable_root: true
write_files:
  - path: /etc/ssh/sshd_config.d/60-pelican.conf
    owner: root:root
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
runcmd:
  - [systemctl, reload, ssh]
