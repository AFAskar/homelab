apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pelican
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pelican.home.internal
    secretName: pelican-tls
  rules:
  - host: pelican.home.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pelican
            port:
              number: 80
