apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  template:
    spec:
      containers:
        - name: homepage
          env:
            - name: HOMEPAGE_VAR_ADGUARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homepage-adguard
                  key: username
            - name: HOMEPAGE_VAR_ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-adguard
                  key: password
            - name: HOMEPAGE_VAR_ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-argocd
                  key: token
            - name: HOMEPAGE_VAR_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-grafana
                  key: password
